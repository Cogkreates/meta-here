<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seelib VR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept: a full-screen 3D reading room. Overlay is minimal: wordmark, one hint line, one Enter VR button. Everything else lives in the scene. */
:root {
  color-scheme: dark;
  --night: #0e1520;
  --text: #e7e2d6;
  --muted: #9aa5b4;
  --brass: #d9a441;
  --line: rgba(255,255,255,.18);
  --panel: #16202e;
  --bad: #f0a08a;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--text); font-family: Georgia, "Times New Roman", serif; overflow: hidden; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui {
  position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mark { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.mark span { color: var(--brass); }
.bottom { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
#hint { margin: 0; font-size: 14px; color: var(--text); background: rgba(8,12,19,.7); padding: 8px 12px; border-radius: 8px; max-width: 34ch; }
#enter {
  pointer-events: auto; min-height: 48px; padding: 0 22px; border-radius: 24px; border: 1px solid var(--brass);
  background: var(--brass); color: #1b1408; font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}
#enter:disabled { background: rgba(255,255,255,.08); color: var(--muted); border-color: var(--line); cursor: default; }
#enter:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
#openAdd {
  pointer-events: auto; min-height: 48px; padding: 0 18px; border-radius: 24px; border: 1px solid var(--brass);
  background: rgba(8,12,19,.7); color: var(--brass); font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}
#openAdd:focus-visible, .sbtn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
#sheet {
  position: fixed; inset: 0; z-index: 30; background: rgba(6,9,14,.88); overflow-y: auto; display: flex; align-items: flex-start; justify-content: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#addForm { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-block: auto; }
#addForm h2 { margin: 0; font-size: 28px; line-height: 1; }
.sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.pick { display: flex; flex-direction: column; gap: 6px; border: 1px dashed var(--brass); border-radius: 8px; padding: 14px; cursor: pointer; background: rgba(217,164,65,.06); }
.pick span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.pick:focus-within { outline: 2px solid var(--brass); outline-offset: 3px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
.field input, .field textarea { font: inherit; font-size: 15px; color: var(--text); background: var(--night); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; min-width: 0; }
.field textarea { resize: vertical; min-height: 84px; }
.st { margin: 0; min-height: 20px; font-size: 13px; color: var(--muted); }
.st.err { color: var(--bad); }
.acts { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.sbtn { min-height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text); font: 500 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.sbtn.go { background: var(--brass); border-color: var(--brass); color: #1b1408; }
.sbtn:disabled { opacity: .4; cursor: default; }
.mine { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mine li { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; min-width: 0; }
.mine .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mine .nm small { color: var(--muted); margin-left: 6px; }
.mine .none { color: var(--muted); border-top: 0; padding-top: 0; }
#msg { margin: 0; font-size: 13px; color: var(--muted); background: rgba(8,12,19,.7); padding: 6px 10px; border-radius: 8px; max-width: 40ch; }
</style>

</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <h1 class="mark">See<span>lib</span></h1>
  <div class="bottom">
    <p id="hint">Tap a spine to pull a book out.</p>
    <p id="msg" hidden></p>
    <div class="btns">
      <button id="enter" type="button" disabled>Checking for VR&hellip;</button>
      <button id="openAdd" type="button">+ Add your books</button>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <form id="addForm" novalidate role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Your books</h2>
    <p class="sub">Add a PDF, a web page saved as HTML, or plain text. Books stay on this device and appear on the lower shelves when you enter VR. Add them here first, then put the headset on.</p>
    <label class="pick" for="file"><strong>Choose a file</strong><span id="fname">PDF, HTML or TXT</span><input id="file" type="file" accept=".pdf,.html,.htm,.txt,.md,application/pdf,text/html,text/plain"></label>
    <label class="field" for="paste">Or paste text<textarea id="paste" placeholder="Paste a chapter or a whole book"></textarea></label>
    <label class="field" for="ttl">Title<input id="ttl" type="text" autocomplete="off" placeholder="Name on the spine"></label>
    <label class="field" for="aut">Author (optional)<input id="aut" type="text" autocomplete="off"></label>
    <p id="st" class="st" role="status"></p>
    <div class="acts"><button type="button" id="closeAdd" class="sbtn">Close</button><button type="submit" id="doAdd" class="sbtn go">Add to shelf</button></div>
    <ul id="mine" class="mine"></ul>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var BOOKS = [
    { title: "Alice's Adventures in Wonderland", short: "Alice in Wonderland", author: "Lewis Carroll", year: "1865", c: "#1f5f63", w: 0.066, h: 0.27,
      pages: [
        ["Chapter I · Down the Rabbit-Hole", "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice, “without pictures or conversations?”"],
        ["Chapter I · Down the Rabbit-Hole", "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her."]
      ] },
    { title: "Pride and Prejudice", short: "Pride and Prejudice", author: "Jane Austen", year: "1813", c: "#6e2430", w: 0.072, h: 0.29,
      pages: [
        ["Chapter I", "It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife."],
        ["Chapter I", "However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered the rightful property of some one or other of their daughters."],
        ["Chapter I", "“My dear Mr. Bennet,” said his lady to him one day, “have you heard that Netherfield Park is let at last?” Mr. Bennet replied that he had not."]
      ] },
    { title: "Frankenstein", short: "Frankenstein", author: "Mary Shelley", year: "1818", c: "#2f4a35", w: 0.06, h: 0.25,
      pages: [
        ["Letter 1 · To Mrs. Saville, England", "You will rejoice to hear that no disaster has accompanied the commencement of an enterprise which you have regarded with such evil forebodings. I arrived here yesterday, and my first task is to assure my dear sister of my welfare and increasing confidence in the success of my undertaking."],
        ["Letter 1 · To Mrs. Saville, England", "I am already far north of London, and as I walk in the streets of Petersburgh, I feel a cold northern breeze play upon my cheeks, which braces my nerves and fills me with delight."]
      ] },
    { title: "The Time Machine", short: "The Time Machine", author: "H. G. Wells", year: "1895", c: "#24385e", w: 0.058, h: 0.28,
      pages: [
        ["Chapter I · Introduction", "The Time Traveller (for so it will be convenient to speak of him) was expounding a recondite matter to us. His grey eyes shone and twinkled, and his usually pale face was flushed and animated."],
        ["Chapter I · Introduction", "The fire burned brightly, and the soft radiance of the incandescent lights in the lilies of silver caught the bubbles that flashed and passed in our glasses."]
      ] },
    { title: "Treasure Island", short: "Treasure Island", author: "R. L. Stevenson", year: "1883", c: "#a8742a", ink: "#1d1409", w: 0.074, h: 0.26,
      pages: [
        ["Part One · The Old Buccaneer", "Squire Trelawney, Dr. Livesey, and the rest of these gentlemen having asked me to write down the whole particulars about Treasure Island, from the beginning to the end, keeping nothing back but the bearings of the island, and that only because there is still treasure not yet lifted, I take up my pen in the year of grace 17—, and go back to the time when my father kept the Admiral Benbow inn."]
      ] }
  ];

  var PW = 0.27, PH = 0.386, DZ = 0.0016;
  var READ_POS = new THREE.Vector3(0, 1.3, -0.8);
  var BRASS = 0xd9a441;

  var canvasEl = document.getElementById("gl");
  var hintEl = document.getElementById("hint");
  var msgEl = document.getElementById("msg");
  var enterBtn = document.getElementById("enter");

  var renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x0e1520);
  renderer.xr.enabled = true;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, 1, 0.05, 30);
  var clock = new THREE.Clock();

  function sizeIt() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 1 ? 75 : 55;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", sizeIt);
  sizeIt();
  camera.position.set(0, 1.35, 0.2);
  camera.lookAt(0, 1.3, -1.6);

  /* ---------- helpers ---------- */
  function tex(cv) {
    var t = new THREE.CanvasTexture(cv);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8;
    return t;
  }
  function mk(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function wrap(ctx, text, maxW) {
    var words = text.split(" "), lines = [], line = "";
    words.forEach(function (w) {
      var test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
    });
    if (line) lines.push(line);
    return lines;
  }
  function paperBg(ctx, w, h, leftShade) {
    var g = ctx.createLinearGradient(0, 0, w, 0);
    if (leftShade) { g.addColorStop(0, "#d8cdb4"); g.addColorStop(0.08, "#ece3cf"); g.addColorStop(1, "#f3ecda"); }
    else { g.addColorStop(0, "#efe6d2"); g.addColorStop(0.92, "#ece3cf"); g.addColorStop(1, "#d8cdb4"); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }

  var CW = 560, CH = 800;

  function pageCanvas(kicker, text, folio) {
    var cv = mk(CW, CH), ctx = cv.getContext("2d");
    paperBg(ctx, CW, CH, true);
    ctx.fillStyle = "#7a6a52"; ctx.font = "500 17px Menlo, monospace"; ctx.textBaseline = "alphabetic";
    ctx.fillText((kicker || "").toUpperCase().slice(0, 40), 56, 64);
    var size = 30, lines;
    var maxH = CH - 64 - 90 - 70;
    for (; size >= 18; size -= 2) {
      ctx.font = size + "px Georgia, serif";
      lines = wrap(ctx, text, CW - 56 - 44);
      if (lines.length * size * 1.4 <= maxH) break;
    }
    ctx.fillStyle = "#2b2219";
    lines.forEach(function (l, i) { ctx.fillText(l, 56, 118 + i * size * 1.4); });
    if (folio) { ctx.fillStyle = "#7a6a52"; ctx.font = "16px Menlo, monospace"; ctx.textAlign = "center"; ctx.fillText(folio, CW / 2 + 6, CH - 34); }
    return cv;
  }
  function titleCanvas(b) {
    var cv = mk(CW, CH), ctx = cv.getContext("2d");
    paperBg(ctx, CW, CH, true);
    ctx.fillStyle = "#2b2219"; ctx.textAlign = "center";
    ctx.font = "700 44px Georgia, serif";
    var lines = wrap(ctx, b.title, CW - 150);
    lines.forEach(function (l, i) { ctx.fillText(l, CW / 2 + 8, 250 + i * 54); });
    ctx.font = "italic 28px Georgia, serif";
    ctx.fillText(b.author, CW / 2 + 8, 270 + lines.length * 54);
    ctx.fillStyle = "#7a6a52"; ctx.font = "16px Menlo, monospace";
    ctx.fillText((b.mine ? "YOUR COPY" : b.year + " · PUBLIC DOMAIN"), CW / 2 + 8, 320 + lines.length * 54);
    return cv;
  }
  function coverCanvas(b) {
    var cv = mk(CW, CH), ctx = cv.getContext("2d");
    ctx.fillStyle = b.c; ctx.fillRect(0, 0, CW, CH);
    var g = ctx.createLinearGradient(0, 0, CW, 0);
    g.addColorStop(0, "rgba(0,0,0,.4)"); g.addColorStop(0.05, "rgba(255,255,255,.1)"); g.addColorStop(0.14, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
    ctx.strokeStyle = "#d9a441"; ctx.globalAlpha = 0.85; ctx.lineWidth = 2; ctx.strokeRect(54, 50, CW - 94, CH - 100); ctx.globalAlpha = 1;
    ctx.fillStyle = b.ink || "#f0e6cf"; ctx.textAlign = "center";
    ctx.font = "700 52px Georgia, serif";
    var lines = wrap(ctx, b.title, CW - 190);
    var y = CH / 2 - (lines.length * 62) / 2;
    lines.forEach(function (l, i) { ctx.fillText(l, CW / 2 + 12, y + i * 62); });
    ctx.fillStyle = "#d9a441"; ctx.fillRect(CW / 2 - 60, y + lines.length * 62 - 10, 144, 3);
    ctx.fillStyle = b.ink || "#f0e6cf"; ctx.font = "500 22px Menlo, monospace";
    ctx.fillText((b.author || "Your copy").toUpperCase(), CW / 2 + 12, y + lines.length * 62 + 50);
    return cv;
  }
  function endpaperCanvas(b) {
    var cv = mk(CW, CH), ctx = cv.getContext("2d");
    ctx.fillStyle = b.c; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(0, 0, CW, CH);
    ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 6;
    for (var i = -CH; i < CW; i += 24) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + CH, CH); ctx.stroke(); }
    return cv;
  }
  function blankBackCanvas() {
    var cv = mk(CW, CH), ctx = cv.getContext("2d");
    paperBg(ctx, CW, CH, false);
    return cv;
  }
  function labelCanvas(w, h, lines, opts) {
    var cv = mk(w, h), ctx = cv.getContext("2d");
    ctx.fillStyle = opts.bg || "rgba(8,12,19,.82)"; ctx.fillRect(0, 0, w, h);
    if (opts.border) { ctx.strokeStyle = "#d9a441"; ctx.lineWidth = 4; ctx.strokeRect(3, 3, w - 6, h - 6); }
    ctx.fillStyle = opts.color || "#e7e2d6"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = opts.font || ((opts.size || 44) + "px Georgia, serif");
    var lh = (opts.size || 44) * 1.3, y0 = h / 2 - ((lines.length - 1) * lh) / 2;
    lines.forEach(function (l, i) { ctx.fillText(l, w / 2, y0 + i * lh); });
    return cv;
  }
  function labelMesh(w, h, px, lines, opts) {
    var cv = labelCanvas(px, Math.round(px * h / w), lines, opts);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex(cv), transparent: true }));
    m.userData.cv = cv;
    return m;
  }
  function redraw(mesh, lines, opts) {
    var old = mesh.userData.cv, cv = labelCanvas(old.width, old.height, lines, opts);
    mesh.material.map.dispose();
    mesh.material.map = tex(cv);
    mesh.userData.cv = cv;
  }

  /* ---------- room ---------- */
  scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x3b2a1f, 0.9));
  var lamp = new THREE.PointLight(0xffc36b, 1.4, 6);
  lamp.position.set(0.9, 2.3, -0.6);
  scene.add(lamp);

  var floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0x2a1d15, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  var wall = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), new THREE.MeshStandardMaterial({ color: 0x141d2b, roughness: 1 }));
  wall.position.set(0, 2, -2.4);
  scene.add(wall);

  var wood = new THREE.MeshStandardMaterial({ color: 0x4a3426, roughness: 0.8 });
  var woodBack = new THREE.MeshStandardMaterial({ color: 0x1a2331, roughness: 1 });
  var shelf = new THREE.Group();
  shelf.position.set(0, 0, -1.6);
  scene.add(shelf);
  var SW = 1.25;
  function box(w, h, d, mat, x, y, z) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); shelf.add(m); return m; }
  box(SW + 0.1, 1.95, 0.03, woodBack, 0, 0.975, -0.09);
  box(0.05, 1.95, 0.28, wood, -SW / 2 - 0.025, 0.975, 0);
  box(0.05, 1.95, 0.28, wood, SW / 2 + 0.025, 0.975, 0);
  var SHELF_Y = [0.2, 0.6, 1.0, 1.45];
  SHELF_Y.forEach(function (y) { box(SW + 0.1, 0.04, 0.28, wood, 0, y, 0); });
  box(SW + 0.1, 0.05, 0.28, wood, 0, 1.92, 0);

  /* spines */
  var spines = [];
  var ROWS = [[0, 1, 2], [3, 4]];
  var ROW_Y = [1.45, 1.0];
  var USER_ROWS_Y = [0.6, 0.2];
  var STOCK = BOOKS.length;
  function spineMesh(i, x, y) {
    var b = BOOKS[i];
    var cv = mk(128, 512), ctx = cv.getContext("2d");
    ctx.fillStyle = b.c; ctx.fillRect(0, 0, 128, 512);
    var g = ctx.createLinearGradient(0, 0, 128, 0);
    g.addColorStop(0, "rgba(255,255,255,.14)"); g.addColorStop(0.25, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(0,0,0,.3)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 512);
    ctx.fillStyle = "#d9a441"; ctx.fillRect(0, 26, 128, 6); ctx.fillRect(0, 480, 128, 6);
    ctx.save(); ctx.translate(64, 256); ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = b.ink || "#f0e6cf"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var sz = 46; ctx.font = "700 " + sz + "px Georgia, serif";
    while (ctx.measureText(b.short).width > 380 && sz > 18) { sz -= 2; ctx.font = "700 " + sz + "px Georgia, serif"; }
    ctx.fillText(b.short, 0, 0);
    ctx.restore();
    var side = new THREE.MeshStandardMaterial({ color: new THREE.Color(b.c), roughness: 0.7 });
    var front = new THREE.MeshStandardMaterial({ map: tex(cv), roughness: 0.7 });
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, 0.16), [side, side, side, side, front, side]);
    mesh.position.set(x + b.w / 2, y + 0.02 + b.h / 2, 0.01);
    mesh.userData.book = i;
    mesh.userData.home = mesh.position.clone();
    mesh.userData.mats = [side, front];
    shelf.add(mesh);
    spines.push(mesh);
    return mesh;
  }
  ROWS.forEach(function (ids, r) {
    var x = -SW / 2 + 0.07;
    ids.forEach(function (i) { spineMesh(i, x, ROW_Y[r]); x += BOOKS[i].w + 0.012; });
  });
  var userSpines = [];
  function layoutUserBooks() {
    userSpines.forEach(function (m) {
      shelf.remove(m);
      m.geometry.dispose();
      m.userData.mats.forEach(function (mt) { if (mt.map) mt.map.dispose(); mt.dispose(); });
      var k = spines.indexOf(m); if (k >= 0) spines.splice(k, 1);
    });
    userSpines = [];
    var row = 0, x = -SW / 2 + 0.07, shown = 0;
    for (var i = STOCK; i < BOOKS.length; i++) {
      var b = BOOKS[i];
      if (x + b.w > SW / 2 - 0.03) { row++; x = -SW / 2 + 0.07; }
      if (row >= USER_ROWS_Y.length) break;
      userSpines.push(spineMesh(i, x, USER_ROWS_Y[row]));
      x += b.w + 0.012; shown++;
    }
    return shown;
  }
  var plaque = labelMesh(0.26, 0.1, 512, ["Free to read.", "All public domain."], { size: 44, color: "#d9a441", bg: "rgba(217,164,65,.08)", border: true, font: "italic 44px Georgia, serif" });
  plaque.position.set(0.3, 1.15, 0.0);
  shelf.add(plaque);

  var hintMesh = labelMesh(0.9, 0.11, 1024, ["Look at a spine and pinch or press trigger."], { size: 46 });
  hintMesh.position.set(0, 2.1, -1.4);
  scene.add(hintMesh);

  /* ---------- the book being read ---------- */
  var rg = new THREE.Group();
  rg.visible = false;
  scene.add(rg);
  var bookG = new THREE.Group();
  rg.add(bookG);
  var winLeaves = {}, descs = [], blankMat = null, boardR = null, boardL = null, hitNext, hitPrev;
  var WIN_BACK = 3, WIN_FWD = 5;
  var planeGeo = new THREE.PlaneGeometry(PW, PH);
  var cur = 0, current = null, state = "shelf";
  var bookTargetX = -PW / 2;

  var invis = new THREE.MeshBasicMaterial({ visible: false });
  hitNext = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), invis);

  function splitLong(p) {

      if (cut < PAGE_LIMIT * 0.45) cut = p.lastIndexOf("! ", PAGE_LIMIT);
      if (cut < PAGE_LIMIT * 0.45) cut = p.lastIndexOf(" ", PAGE_LIMIT);
      if (cut < 1) cut = PAGE_LIMIT;

      p = p.slice(cut + 1).trim();

  }

    });
    bookG.position.x += (bookTargetX - bookG.position.x) * Math.min(1, dt * 5);
    if (tween) {
      tween.t += tween.dir * dt / 0.7;
      var t = Math.max(0, Math.min(1, tween.t));
      var e = ease(t);
      rg.position.lerpVectors(tween.from, READ_POS, e);
      rg.scale.setScalar(0.3 + 0.7 * e);
      if (tween.dir > 0 && t >= 1) { tween = null; state = "reading"; }
      else if (tween.dir < 0 && t <= 0) { tween = null; rg.visible = false; activeSpine.visible = true; state = "shelf"; }
    }
    var over = null;
    if (renderer.xr.isPresenting) {
      ctrls.forEach(function (c) {
        var h = pickFromController(c);
        c.userData.line.scale.z = h ? h.distance : 1.5;
        if (h && h.object.userData.book !== undefined) over = h.object;
      });
      var gh = pickFromGaze();
      updateReticle(gh);
      if (!over && gh && gh.object.userData.book !== undefined) over = gh.object;
    } else {
      reticle.visible = false;
    }
    if (over !== hovered) {
      if (hovered) hovered.scale.set(1, 1, 1);
      if (over) over.scale.set(1.08, 1.04, 1.25);
      hovered = over;
    }
    renderer.render(scene, camera);
  });
})();
</script>
